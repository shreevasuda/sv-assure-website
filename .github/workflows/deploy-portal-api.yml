name: Deploy SV Assure portal API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svassure-portal-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dedicated API Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret." && exit 1)
          test -n "$D1_DATABASE_ID" || (echo "::error::Add the D1_DATABASE_ID repository secret." && exit 1)
          case "$D1_DATABASE_ID" in
            *[!a-fA-F0-9-]*|"") echo "::error::D1_DATABASE_ID must be the database UUID from Cloudflare." && exit 1 ;;
          esac

      - name: Inject D1 ID into ephemeral deployment config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" portal-worker/wrangler.toml
          ! grep -q "REPLACE_WITH_D1_DATABASE_ID" portal-worker/wrangler.toml

      - name: Apply additive D1 schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute svassure-portal --remote --file=cloudflare/schema.sql
          workingDirectory: .

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config portal-worker/wrangler.toml
          workingDirectory: .
