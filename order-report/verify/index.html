<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Secure sign-in | SV Assure</title><link rel="stylesheet" href="../portal.css"></head><body><main class="intro" style="max-width:680px;margin:8vh auto;padding:24px"><p class="eyebrow">SV ASSURE REPORT PORTAL</p><h1>Secure sign-in</h1><p id="message" role="status">Verifying your one-time sign-in link…</p><p><a href="/order-report/">Return to the report portal</a></p></main><script> (async()=>{const m=document.getElementById('message'),token=new URLSearchParams(location.search).get('token');history.replaceState({},'',location.pathname);if(!token){m.textContent='The sign-in link is missing. Please request a new one.';return}try{const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),d=await r.json();if(!r.ok)throw Error(d.error||'Sign-in failed');m.textContent='You are signed in as '+d.email+'. You can now view your requisitions and authorised reports.';const a=document.createElement('a');a.href='/order-report/my-orders/';a.textContent='Open my requisitions';m.appendChild(document.createElement('p')).appendChild(a)}catch(e){m.textContent=e.message||'Sign-in failed. Request a new link.'}})();</script></body></html>
