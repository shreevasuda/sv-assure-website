<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My requisitions | SV Assure</title><link rel="stylesheet" href="../portal.css"><style>.orders{max-width:1000px;margin:0 auto;padding:24px}.order{background:#fff;border:1px solid #dbe4ed;border-radius:12px;padding:16px;margin:12px 0}.order h2{font-size:18px;margin:0 0 8px}.muted{color:#617386}.status{display:inline-block;background:#eaf3fb;padding:5px 9px;border-radius:20px;font-size:13px}</style></head><body><header class="site-header"><a class="brand" href="/"><img src="../../assets/logo-h.png" alt="SV Assure"></a><nav><a href="/order-report/">Order a Report</a></nav></header><main class="orders"><p class="eyebrow">BANKER PORTAL</p><h1>My requisitions</h1><p id="message" role="status">Loading your requisitions…</p><div id="orders"></div><p><button id="signout" class="button">Sign out</button></p></main><script src="../api-config.js"></script><script>(async()=>{const msg=document.getElementById('message'),list=document.getElementById('orders');try{const r=await window.svaApi('/api/my-orders');const d=await r.json();if(!r.ok)throw Error(d.error||'Please sign in');msg.textContent='Showing requisitions for your verified email address.';for(const o of d.orders){const card=document.createElement('section');card.className='order';const h=document.createElement('h2');h.textContent=o.reference+' — '+o.borrower_name;card.appendChild(h);const p=document.createElement('p');p.className='muted';p.textContent=o.report_type+' · Submitted '+o.created_at;card.appendChild(p);const s=document.createElement('span');s.className='status';s.textContent=o.status;card.appendChild(s);if(o.report_available){const a=document.createElement('a');a.href='/api/reports?id='+encodeURIComponent(o.id);a.textContent='Download authorised report';a.style.marginLeft='14px';card.appendChild(a)}list.appendChild(card)}if(!d.orders.length)msg.textContent='No requisitions are linked to this email address yet.'}catch(e){msg.textContent=e.message+' — return to the portal and request a secure sign-in link.'}})();document.getElementById('signout').onclick=async()=>{await window.svaApi('/api/auth/me',{method:'DELETE'});location.href='/order-report/'};</script></body></html>
