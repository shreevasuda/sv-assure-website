<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | SV Assure</title><link rel="stylesheet" href="../portal.css"><style>.wrap{max-width:1180px;margin:auto;padding:24px}.toolbar,.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row{border:1px solid #dbe4ed;border-radius:10px;padding:14px;margin:12px 0;background:white}.row>div{flex:1;min-width:180px}.small{font-size:13px;color:#5d6d7e}input,select{padding:10px;border:1px solid #ccd6e0;border-radius:6px;max-width:100%}#orders{margin-top:18px}.button{cursor:pointer}.danger{color:#9b2525}</style></head><body><header class="site-header"><a class="brand" href="/"><img src="../../assets/logo-h.png" alt="SV Assure"></a><nav><a href="/order-report/">Order a Report</a></nav></header><main class="wrap"><p class="eyebrow">RESTRICTED ADMIN</p><h1>Report requisitions</h1><p class="small">Use only on a trusted device. The admin token is held in this page's memory only and is not saved in browser storage.</p><form id="auth" class="toolbar"><label>Admin token <input id="token" type="password" autocomplete="current-password" required></label><button class="button primary">Open dashboard</button></form><p id="msg" role="status"></p><section id="panel" hidden><div class="toolbar"><input id="q" placeholder="Search reference, borrower, bank, email"><select id="filter"><option value="">All statuses</option><option>New</option><option>Accepted</option><option>In Progress</option><option>Query Raised</option><option>Completed</option><option>Cancelled</option></select><button id="refresh" class="button">Refresh</button></div><div id="orders"></div></section></main><script>(()=>{let token='';const msg=document.getElementById('msg'),panel=document.getElementById('panel'),list=document.getElementById('orders');const statuses=['New','Accepted','In Progress','Query Raised','Completed','Cancelled'];async function api(path,opts={}){opts.headers={...(opts.headers||{}),'X-Admin-Token':token};const r=await fetch(path,opts),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){msg.textContent='Loading…';try{const p=new URLSearchParams();if(document.getElementById('q').value)p.set('q',document.getElementById('q').value);if(document.getElementById('filter').value)p.set('status',document.getElementById('filter').value);const d=await api('/api/admin/orders?'+p);list.replaceChildren();for(const o of d.orders){const card=document.createElement('article');card.className='row';const left=document.createElement('div');const h=document.createElement('h3');h.textContent=o.reference+' · '+o.borrower_name;left.appendChild(h);const detail=document.createElement('p');detail.className='small';detail.textContent=o.bank_name+' / '+o.banker_name+' · '+o.banker_email+' · '+o.created_at;left.appendChild(detail);const contact=document.createElement('p');contact.className='small';contact.textContent='Borrower: '+o.borrower_mobile+' · Banker: '+o.banker_mobile+' · GSTIN: '+(o.gstin||'—')+' · '+(o.location||'');left.appendChild(contact);if(o.remarks){const rem=document.createElement('p');rem.textContent='Notes: '+o.remarks;left.appendChild(rem)}const right=document.createElement('div');const sel=document.createElement('select');statuses.forEach(s=>{const op=document.createElement('option');op.value=s;op.textContent=s;op.selected=s===o.status;sel.appendChild(op)});sel.setAttribute('aria-label','Status for '+o.reference);const save=document.createElement('button');save.className='button';save.textContent='Save status';save.onclick=async()=>{try{await api('/api/admin/orders',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id,status:sel.value})});msg.textContent='Status updated.';await load()}catch(e){msg.textContent=e.message}};right.append(sel,save);const upload=document.createElement('form');upload.className='small';upload.style.marginTop='12px';const file=document.createElement('input');file.type='file';file.accept='application/pdf';file.required=true;file.setAttribute('aria-label','PDF report for '+o.reference);const hidden=document.createElement('input');hidden.type='hidden';hidden.name='orderId';hidden.value=o.id;const up=document.createElement('button');up.className='button';up.textContent=o.report_available?'Replace PDF report':'Upload PDF report';upload.append(hidden,file,up);upload.onsubmit=async e=>{e.preventDefault();const fd=new FormData(upload);try{await api('/api/reports',{method:'POST',body:fd});msg.textContent='Report uploaded privately and order marked Completed.';await load()}catch(err){msg.textContent=err.message}};if(o.report_available){const dl=document.createElement('button');dl.className='button';dl.textContent='Download stored report';dl.onclick=async()=>{try{const r=await fetch('/api/reports?id='+o.id,{headers:{'X-Admin-Token':token}});if(!r.ok){const d=await r.json();throw Error(d.error||'Download failed')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.reference+'-report.pdf';a.click();URL.revokeObjectURL(a.href)}catch(e){msg.textContent=e.message}};right.appendChild(dl)}right.appendChild(upload);card.append(left,right);list.appendChild(card)}msg.textContent='Loaded '+d.orders.length+' requisition(s).'}catch(e){msg.textContent=e.message;panel.hidden=true}}document.getElementById('auth').onsubmit=async e=>{e.preventDefault();token=document.getElementById('token').value;panel.hidden=false;await load()};document.getElementById('refresh').onclick=load;document.getElementById('filter').onchange=load;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();load()}}})();</script></body></html>
