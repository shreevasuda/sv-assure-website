name = "svassure-report-portal-api"
main = "src/index.js"
compatibility_date = "2026-10-13"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "svassure-portal"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "svassure-private-reports"

[vars]
PUBLIC_SITE_URL = "https://svassure.com"
NOTIFY_EMAIL = "contact@svassure.com"
MAIL_FROM = "SV Assure Reports <notifications@svassure.com>"

# RESEND_API_KEY and ADMIN_TOKEN must be configured as Worker secrets in Cloudflare.
